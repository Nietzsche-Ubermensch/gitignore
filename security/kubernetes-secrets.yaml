# Kubernetes Secrets — Environment Variable Injection at Deployment
# =================================================================
# API keys are stored as Kubernetes Secrets and injected into pods as
# environment variables. Keys never appear in source code or container images.
#
# Usage:
#   1. Create the secret:
#      kubectl create secret generic api-credentials \
#        --from-literal=API_KEY='real-api-key-value' \
#        --from-literal=API_SECRET='real-api-secret-value'
#
#   2. Apply this deployment manifest:
#      kubectl apply -f kubernetes-secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: api-credentials
  namespace: default
type: Opaque
# Values must be base64-encoded:
#   echo -n 'real-api-key-value' | base64
data:
  API_KEY: cmVhbC1hcGkta2V5LXZhbHVl        # placeholder base64
  API_SECRET: cmVhbC1hcGktc2VjcmV0LXZhbHVl  # placeholder base64

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: my-app:latest
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: API_KEY
            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-credentials
                  key: API_SECRET
          # Alternative: mount all keys from the secret as a volume
          # volumeMounts:
          #   - name: secret-volume
          #     mountPath: /etc/secrets
          #     readOnly: true
      # volumes:
      #   - name: secret-volume
      #     secret:
      #       secretName: api-credentials
